server {
    listen 80;
    server_name _;
    server_tokens off;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    # Same policy as the Render static site, but the API is same-origin here (/backend), so only 'self'.
    # No HSTS: this local Compose site is plain HTTP on 127.0.0.1. Locations below must not use add_header
    # (it would drop these inherited headers).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://tile.openstreetmap.org; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /backend {
        return 308 /backend/;
    }

    # Trailing slash removes /backend/ and preserves /api/... and query parameters.
    location ^~ /backend/ {
        proxy_pass http://backend:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # Missing assets must be real 404s instead of index.html masquerading as a font.
    location /assets/ {
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    # React BrowserRouter direct page access and refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
