server {
    listen 80;
    server_name _;
    server_tokens off;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /backend {
        return 308 /backend/;
    }

    # Trailing slash removes /backend/ and preserves /api/... and query parameters.
    location ^~ /backend/ {
        proxy_pass http://backend:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # Missing assets must be real 404s instead of index.html masquerading as a font.
    location /assets/ {
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    # React BrowserRouter direct page access and refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
